services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: liyan
      POSTGRES_USER: liyan
      POSTGRES_PASSWORD: liyan
    ports:
      # 5433 on the host, not 5432. A machine-wide PostgreSQL — Homebrew's or
      # Postgres.app's — commonly holds 5432 on 127.0.0.1 and wins over Docker's
      # wildcard bind, so the project would silently connect to the wrong server
      # and report that the `liyan` role does not exist.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liyan -d liyan"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - liyan-postgres:/var/lib/postgresql/data
  broker:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  liyan-postgres:
