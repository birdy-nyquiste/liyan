# 立言阁 on Render: the API, two workers split by what their work costs a
# machine, the beat process that runs what nobody triggers, PostgreSQL, and the
# queue.
#
# One blueprint describes one environment. Staging and Production are two
# separate deployments of this file with their own service names and their own
# secrets — never one stack with two URLs pointed at it. Every secret below is
# `sync: false`, so Render asks for it per environment and no value can be
# copied from one to the other by being committed here.
#
# Beat matters as much as the worker: without it nothing is ever cleaned up and
# no stalled Execution is ever noticed, and neither failure raises anything.

services:
  - type: web
    name: liyan-api
    runtime: python
    region: singapore
    plan: starter
    healthCheckPath: /health/ready
    buildCommand: pip install uv && uv sync --locked
    # Migrations run here, not in the build. A build has no guaranteed route to
    # the private database, and it runs even for a deploy that is then cancelled
    # — which would leave the schema ahead of the code serving traffic. A
    # pre-deploy runs once, after the build, before any request reaches the new
    # version, and a failure stops the deploy instead of half-applying it.
    preDeployCommand: uv run alembic upgrade head
    startCommand: uv run uvicorn liyan_server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LIYAN_DATABASE_URL
        fromDatabase:
          name: liyan-postgres
          property: connectionString
      - key: LIYAN_BROKER_URL
        fromService:
          type: keyvalue
          name: liyan-queue
          property: connectionString
      - key: LIYAN_CORS_ORIGINS
        sync: false
      - key: LIYAN_SUPABASE_AUDIENCE
        value: authenticated
      # The rest — R2, DeepSeek, Blog, the allowlist, Supabase — come from the
      # group, so one environment's value is entered once and the API and the
      # workers cannot drift apart.
      - fromGroup: liyan-shared

  # Two workers, split by what the work costs a machine rather than by what it
  # means. One worker did both, and the mis-sizing was at the centre of it: a
  # 知言 run is an `httpx.post` sitting on a socket for two to three minutes,
  # using no meaningful memory and no CPU, and it was holding the single slot
  # that exists because of Chromium. A memory budget was throttling a network
  # wait.
  #
  # Deploy order matters, and only one way round: bring up liyan-worker-provider
  # first, consuming a queue nothing routes to yet, and deploy the API after.
  # The reverse strands every 知言 run on a queue with no consumer, and nothing
  # reports it. No drain is needed — work already queued on source-processing at
  # cutover still runs, because `process_execution` branches on the operation
  # rather than on which queue delivered it.
  - type: worker
    name: liyan-worker-heavy
    runtime: python
    region: singapore
    plan: starter
    # Chromium as well as the packages: URL 来源 are extracted by driving a
    # headless browser, and it is not a Python dependency, so `uv sync` alone
    # leaves crawl4ai naming a binary that does not exist. Every URL 来源 then
    # fails with a message that says nothing about browsers. Roughly 95MB and a
    # minute per build — and only here now: the API dispatches, beat sweeps, and
    # the provider worker never opens a page.
    buildCommand: pip install uv && uv sync --locked && uv run playwright install chromium
    # Concurrency is set, not defaulted. Celery forks one child per CPU, each
    # child is a fully imported copy of this application at roughly 110MB, and
    # a URL fetch then launches Chromium beside it — several hundred megabytes
    # before any 来源 is read, on an instance with 512. This is the process that
    # number was always for.
    #
    # max-tasks-per-child recycles the process periodically so a browser that
    # does not release everything cannot accumulate across a day.
    #
    # -Q is explicit on both workers. Left off, this one would also consume
    # provider-runs and the split would buy nothing while looking like it had.
    startCommand: >-
      uv run celery -A liyan_server.celery_worker worker
      --queues=source-processing
      --loglevel=info --concurrency=1 --max-tasks-per-child=8
      --without-gossip --without-mingle
    envVars:
      # Where the browser is downloaded to, and later looked for. Playwright
      # defaults to ~/.cache, and on Render that directory does not survive from
      # the build into the running service: the build installs Chromium happily
      # and every URL 来源 then fails with "Executable doesn't exist". Only the
      # project directory persists, so the browser goes there.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright
      - key: LIYAN_WORKER_NAME
        value: liyan-worker-heavy
      - key: LIYAN_WORKER_CONCURRENCY
        value: "1"
      - fromGroup: liyan-shared
      - key: LIYAN_DATABASE_URL
        fromDatabase:
          name: liyan-postgres
          property: connectionString
      - key: LIYAN_BROKER_URL
        fromService:
          type: keyvalue
          name: liyan-queue
          property: connectionString

  - type: worker
    name: liyan-worker-provider
    runtime: python
    region: singapore
    plan: starter
    # No Chromium. This process never opens a page, so the browser is 95MB and
    # a minute of build time for nothing.
    buildCommand: pip install uv && uv sync --locked
    # Threads, not prefork, and that is the whole point. Prefork at concurrency
    # four would be four × 110MB of interpreter; threads give one interpreter
    # and four blocked sockets, which is the actual shape of this work.
    #
    # Four rather than eight: the wall after this split is DeepSeek, not Celery.
    # Shipping eight before a provider-side limiter exists converts an invisible
    # queueing problem into a visible provider-error problem, which is worse —
    # users see it, and under ADR-0005 every such failure spends a target's
    # retry allowance. Raise it once that limiter exists.
    #
    # LIYAN_WORKER_CONCURRENCY must move with this number: it is what the
    # database pool is sized from, and a pool smaller than the concurrency it
    # serves is intermittent connection exhaustion that reads as a database
    # fault.
    startCommand: >-
      uv run celery -A liyan_server.celery_worker worker
      --queues=provider-runs
      --loglevel=info --pool=threads --concurrency=4
      --without-gossip --without-mingle
    envVars:
      - key: LIYAN_WORKER_NAME
        value: liyan-worker-provider
      - key: LIYAN_WORKER_CONCURRENCY
        value: "4"
      - fromGroup: liyan-shared
      - key: LIYAN_DATABASE_URL
        fromDatabase:
          name: liyan-postgres
          property: connectionString
      - key: LIYAN_BROKER_URL
        fromService:
          type: keyvalue
          name: liyan-queue
          property: connectionString

  # Beat, not a Render cron job: the schedule lives in the application so the
  # worker and the schedule cannot drift apart, and so a missed tick is simply
  # a later sweep rather than a job that has to be reasoned about separately.
  - type: worker
    name: liyan-beat
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install uv && uv sync --locked
    startCommand: uv run celery -A liyan_server.celery_worker beat --loglevel=info
    # No LIYAN_WORKER_NAME here, deliberately. Beat only schedules; it never
    # executes a task, so nothing in this process ever reads one. Its heartbeat
    # is written under `worker_health.BEAT_WORKER` by whichever worker runs the
    # task beat sent — which is the only evidence beat is alive.
    envVars:
      - fromGroup: liyan-shared
      - key: LIYAN_DATABASE_URL
        fromDatabase:
          name: liyan-postgres
          property: connectionString
      - key: LIYAN_BROKER_URL
        fromService:
          type: keyvalue
          name: liyan-queue
          property: connectionString

  - type: keyvalue
    name: liyan-queue
    region: singapore
    plan: starter
    # The queue carries Execution identity and nothing else, so no business
    # content is ever at rest here. It is still this environment's alone.
    ipAllowList: []

databases:
  - name: liyan-postgres
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "17"

# Values that are the same for every process in one environment, and different
# in every environment. Render prompts for each one per deployment.
envVarGroups:
  - name: liyan-shared
    envVars:
      - key: LIYAN_DEEPSEEK_API_KEY
        sync: false
      - key: LIYAN_R2_ENDPOINT_URL
        sync: false
      - key: LIYAN_R2_ACCESS_KEY_ID
        sync: false
      - key: LIYAN_R2_SECRET_ACCESS_KEY
        sync: false
      - key: LIYAN_R2_BUCKET
        sync: false
      - key: LIYAN_PUBLICATION_TARGETS
        sync: false
      - key: LIYAN_BLOG_INGEST_TOKEN
        sync: false
      - key: LIYAN_ALLOWED_EMAILS
        sync: false
      # Stripe. All three together or none: a secret key without a signing
      # secret opens Checkout and credits nothing, which /health/ready reports
      # as `billing: "unconfigured"` rather than as most of the way there. The
      # 额度包 map is the only authority on what a payment buys.
      - key: LIYAN_STRIPE_SECRET_KEY
        sync: false
      - key: LIYAN_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: LIYAN_STRIPE_CREDIT_PACKS
        sync: false
      # Where Checkout returns a user. The workbench origin, not the API's.
      - key: LIYAN_WEB_BASE_URL
        sync: false
      - key: LIYAN_SUPABASE_ISSUER
        sync: false
