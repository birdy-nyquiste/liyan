name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: liyan_test
          POSTGRES_USER: liyan
          POSTGRES_PASSWORD: liyan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liyan -d liyan_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      LIYAN_DATABASE_URL: postgresql+psycopg://liyan:liyan@localhost:5432/liyan_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      - name: Check backend
        run: |
          uv run ruff check apps/server scripts
          uv run mypy
          uv run pytest

      # The suite again, on the backend production actually uses. SQLite does
      # not enforce foreign keys unless asked and this project never asks, so a
      # delete that violates a constraint passes above and fails in production.
      # Only this step can see that difference.
      - name: Check backend against PostgreSQL
        env:
          LIYAN_TEST_DATABASE_URL: postgresql+psycopg://liyan:liyan@localhost:5432/liyan_test
        run: uv run pytest

      - name: Check empty-database migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Check frontend
        run: |
          npm run lint:web
          npm run typecheck:web
          npm run test:web
          npm run build --workspace @liyan/web

      # The 插件 is a shipped artifact — a package uploaded to the Chrome Web
      # Store — and until now nothing here looked at it. Its build is run with
      # `--mode e2e` because that is the only configuration a checkout has:
      # `.env` and `.env.production` are both gitignored, so without a mode the
      # manifest plugin has no Supabase host and refuses to build.
      #
      # `--workspace` directly rather than through `build:extension`: npm does
      # not forward flags through two nested `npm run`s, and `-- --mode e2e`
      # reaches vite as a bare `e2e` — which is not an error, it is a
      # production build with a stray argument.
      - name: Check the browser extension
        run: |
          npm run lint:extension
          npm run typecheck:extension
          npm run test:extension
          npm run build --workspace @liyan/extension -- --mode e2e

      - name: Check generated OpenAPI contract
        run: npm run api:check

      # The browser half of the release gate, in the run that proves the
      # workbench rather than a deployment: a real Chromium against the real
      # application on a disposable database, with identity and the paid
      # providers substituted (`scripts/e2e_server.py`). The Staging run is
      # what a release turns on, and it cannot happen here — this is what keeps
      # the same specs from rotting between releases.
      - name: Check the workbench in a browser
        run: |
          npm exec --workspace @liyan/web -- playwright install --with-deps chromium
          npm run test:e2e --workspace @liyan/web
