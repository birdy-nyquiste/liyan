services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: liyan
      POSTGRES_USER: liyan
      POSTGRES_PASSWORD: liyan
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liyan -d liyan"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - liyan-postgres:/var/lib/postgresql/data

volumes:
  liyan-postgres:
